# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: Go

on:
  push:
    branches: [ "main" ]
    tags:
    - "v*.*.*"
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_NAME: shellyctl

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Build Linux AMD64
      run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o shellyctl_linux_amd64

    - name: Build Linux ARM64
      run: GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -o shellyctl_linux_arm64

    - name: Build Windows AMD64
      run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o shellyctl_windows_arm64

    - name: Test
      run: go test -v ./...

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GITHUB_REPOSITORY: jcodybaker/shellyctl
      with:
        token: ${{ secrets.CUSTOM_GITHUB_TOKEN }}
        files: |
          shellyctl_linux_amd64
          shellyctl_linux_arm64
          shellyctl_windows_arm64

    - name: Build image
      if: github.ref == 'refs/heads/main'
      run: docker build . --file ./ci/Dockerfile --tag $IMAGE_NAME --label "runnumber=${GITHUB_RUN_ID}"

    - name: Log in to registry
      if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

    - name: Push image
      if: github.ref == 'refs/heads/main'
      run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME

          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          echo IMAGE_ID=$IMAGE_ID
          docker tag $IMAGE_NAME $IMAGE_ID:latest
          docker tag $IMAGE_NAME $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:${{ github.sha }}

    - name: Tag release image
      if: startsWith(github.ref, 'refs/tags/')
      run: |
          IMAGE_ID=ghcr.io/${{ github.repository_owner }}/$IMAGE_NAME

          IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')

          VERSION=$(echo "${{ github.ref }}" | sed -e 's,.*/\(.*\),\1,' -e 's/^v//')

          echo IMAGE_ID=$IMAGE_ID
          echo VERSION=$VERSION

          for i in $(seq 1 45); do
            if docker pull $IMAGE_ID:${{ github.sha }}; then
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "Timed out waiting for main build to publish $IMAGE_ID:${{ github.sha }} - check that the 'Go' workflow succeeded on main for this commit" >&2
              exit 1
            fi
            echo "Waiting for main build to publish $IMAGE_ID:${{ github.sha }} (attempt $i/45)..."
            sleep 20
          done

          docker tag $IMAGE_ID:${{ github.sha }} $IMAGE_ID:$VERSION
          docker push $IMAGE_ID:$VERSION